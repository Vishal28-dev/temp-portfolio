name: ${COMPOSE_PROJECT_NAME:-vishal-portfolio}

services:
  # ----------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-vishal-portfolio}-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      APP_USER: ${MONGO_APP_USER}
      APP_PASSWORD: ${MONGO_APP_PASSWORD}
      APP_DB: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [portfolio]

  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-vishal-portfolio}-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: development
      PORT: "4000"
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=${MONGO_DB}
    volumes:
      - ./backend/src:/app/src
      - api-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks: [portfolio]

  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-vishal-portfolio}-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: development
      VITE_API_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:4000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    networks: [portfolio]

networks:
  portfolio:
    driver: bridge

volumes:
  mongo-data:
  api-uploads:

# nginx quirk: an `add_header` inside a location block DISCARDS every header
# inherited from the server block. Any location that sets its own header must
# therefore re-add these, so they live in one file and get included everywhere.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
